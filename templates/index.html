<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LangGraph LLM App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        textarea { width: 100%; height: 80px; padding: 10px; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #007BFF; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; background: #f4f4f4; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>LangGraph Q&A Assistant</h2>
    <form id="chat-form">
        <textarea id="question"name="question" placeholder="Ask something..."></textarea>
        <button type="submit">Submit</button>
    </form>
    <div class="result" id="result-box">Response will appear here...</div>

    <script>
        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = document.getElementById('question').value;
            const resultBox = document.getElementById('result-box');
            resultBox.innerText = "Thinking...";

            const response = await fetch('/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question })
            });

            const data = await response.json();
            resultBox.innerText = data.answer || data.error;
        });
    </script>
</body>
</html>
